name: Deploy to Cloudways

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PHP dependencies
        run: composer install --no-dev

      - name: Build and Prepare Dist Folder (Staging)
        run: |
          # (Optional) Run any build commands, e.g., if you have JS assets:
          npm run build
          mkdir -p dist
          rsync -r --exclude 'dist' --exclude '.git' --exclude '.github' --exclude '.gitignore' . dist

      - name: Deploy to Staging via rsync
        env:
          remote_host: ${{ secrets.STAGING_HOST }}
          remote_port: "22"
          remote_user: ${{ secrets.STAGING_USER }}
          remote_key: ${{ secrets.STAGING_SSH_KEY }}
          local_dir: "dist/"
          remote_dir: ${{ secrets.STAGING_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$remote_key" > ~/.ssh/gh_actions_key
          chmod 600 ~/.ssh/gh_actions_key
          rsync -avzr -e "ssh -p ${remote_port} -i ~/.ssh/gh_actions_key -o StrictHostKeyChecking=no" ${local_dir} ${remote_user}@${remote_host}:${remote_dir}

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP dependencies
        run: composer install --no-dev

      - name: Deploy to Production
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /public_html
            git pull origin main
            composer install --no-dev
            npm run build
            ./vendor/bin/phinx migrate -e production
            sudo systemctl restart php-fpm