name: Deploy to Cloudways

on:
  push:
    branches:
      - develop  # Adjust based on your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Debug GitHub Secrets (Non-Sensitive Info)
        run: |
          echo "Checking environment variables..."
          echo "Server ID: ${{ secrets.CLOUDWAYS_SERVER_ID }}"
          echo "App ID: ${{ secrets.CLOUDWAYS_APP_ID }}"
          echo "Branch: ${{ secrets.CLOUDWAYS_BRANCH_NAME }}"
          echo "Deploy Path: ${{ secrets.CLOUDWAYS_DEPLOY_PATH }}"
      
      - name: Deploy to Cloudways
        uses: roelmagdaleno/cloudways-api-git-pull-action@v1.3.0
        with:
          email: ${{ secrets.CLOUDWAYS_EMAIL }}
          api-key: ${{ secrets.CLOUDWAYS_API_KEY }}
          server-id: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          app-id: ${{ secrets.CLOUDWAYS_APP_ID }}
          branch-name: ${{ secrets.CLOUDWAYS_BRANCH_NAME }}
          deploy-path: ${{ secrets.CLOUDWAYS_DEPLOY_PATH }}

      - name: SSH into Cloudways and Run Post-Deployment Steps
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CLOUDWAYS_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            set -e  # Stop execution on error

            echo "✅ Connecting to Cloudways..."
            cd ${{ secrets.CLOUDWAYS_DEPLOY_PATH }} || exit 1

            echo "📦 Installing PHP dependencies with Composer..."
            composer install --no-dev --optimize-autoloader || exit 1

            echo "🛠 Setting up environment variables..."
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            echo "🔑 Generating application key..."
            php artisan key:generate || true

            echo "📂 Setting correct permissions..."
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache

            echo "🗄 Running Phinx migrations..."
            vendor/bin/phinx migrate || exit 1

            echo "🌱 Running Phinx seeders (if applicable)..."
            vendor/bin/phinx seed:run || true

            echo "🧹 Clearing cache and optimizing configurations..."
            php artisan cache:clear || true
            php artisan config:cache || true

            echo "🔄 Restarting PHP-FPM to apply changes..."
            sudo service php8.2-fpm restart || true

            echo "🚀 Deployment completed successfully!"
