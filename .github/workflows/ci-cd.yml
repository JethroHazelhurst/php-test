name: Deploy to Cloudways

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Global Build Tools
        run: npm install -g terser

      - name: Install PHP Dependencies
        run: composer install --no-dev

      - name: Build and Prepare Dist Folder (Staging)
        run: |
          npm run build
          mkdir -p dist
          rsync -r --exclude 'dist' --exclude '.git' --exclude '.github' --exclude '.gitignore' . dist

      - name: Deploy to Production via rsync
        env:
          remote_host: ${{ secrets.PROD_HOST }}
          remote_port: "22"
          remote_user: ${{ secrets.PROD_USER }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}
          local_dir: "."  # the root of your local repo
          remote_dir: "/home/1325249.cloudwaysapps.com/prkwvvdmaj"  # the "application" folder
        run: |
          mkdir -p ~/.ssh
          echo "$remote_key" > ~/.ssh/gh_actions_key
          chmod 600 ~/.ssh/gh_actions_key
          rsync -avz --no-times --no-perms \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "scss" \
            --exclude ".gitignore" \
            -e "ssh -p ${remote_port} -i ~/.ssh/gh_actions_key -o StrictHostKeyChecking=no" \
            ${local_dir} ${remote_user}@${remote_host}:${remote_dir}


  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Global Build Tools
        run: npm install -g terser

      - name: Install PHP Dependencies
        run: composer install --no-dev

      - name: Build and Prepare Dist Folder (Production)
        run: |
          npm run build
          mkdir -p dist
          rsync -r --exclude 'dist' --exclude '.git' --exclude '.github' --exclude '.gitignore' . dist

      - name: Setup SSH Key for Production
        env:
          remote_key: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$remote_key" > ~/.ssh/gh_actions_key
          chmod 600 ~/.ssh/gh_actions_key

      - name: Deploy to Production via rsync
        env:
          remote_host: ${{ secrets.PROD_HOST }}
          remote_port: "22"
          remote_user: ${{ secrets.PROD_USER }}
          local_dir: "dist/"
          remote_dir: "."   # Using current directory since SSH lands in public_html
        run: |
          rsync -avzr -e "ssh -p ${remote_port} -i ~/.ssh/gh_actions_key -o StrictHostKeyChecking=no" ${local_dir} ${remote_user}@${remote_host}:${remote_dir}

      - name: Run Post-Deployment Commands on Production
        env:
          remote_host: ${{ secrets.PROD_HOST }}
          remote_port: "22"
          remote_user: ${{ secrets.PROD_USER }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}
          remote_dir: "."   # Using current directory since SSH lands in public_html
        run: |
          mkdir -p ~/.ssh
          echo "$remote_key" > ~/.ssh/gh_actions_key
          chmod 600 ~/.ssh/gh_actions_key
          ssh -p ${remote_port} -i ~/.ssh/gh_actions_key -o StrictHostKeyChecking=no ${remote_user}@${remote_host} "cd ${remote_dir} && ./vendor/bin/phinx migrate -e production && sudo systemctl restart php-fpm"
